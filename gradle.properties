# HEAVY / SOLO-ONLY build. R8 release minification needs headroom; this daemon gets 6g + kotlin 2g.
# RUN THIS SOLO — do not run in parallel with another heavy build (Agora+aiope together OOMs 15 GB).
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/home/ubuntu/.gradle/tmp
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# Configuration cache: skips the configuration phase on repeat builds (big win for iterative work).
# warn mode keeps building even if a task isn't yet CC-compatible instead of failing hard.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Kotlin incremental compilation (default on; pinned explicitly).
kotlin.incremental=true
