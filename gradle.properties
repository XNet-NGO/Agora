# HEAVY / SOLO-ONLY build. R8 release minification OOMed at 2g, so this daemon gets 4g + kotlin 3g.
# RUN THIS SOLO — do not run in parallel with another heavy build (Agora+aiope together OOMs 15 GB).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/home/ubuntu/.gradle/tmp
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
